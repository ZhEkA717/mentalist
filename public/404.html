<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Страница не найдена — Александр Шишук</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: Montserrat, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 560px; }
    .code {
      font-size: clamp(72px, 18vw, 140px);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(90deg, #80724C -17.31%, #E6CC89 93.14%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 600;
      margin: 20px 0 12px;
      color: #DFC784;
    }
    p {
      font-size: 15px;
      font-weight: 300;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 32px;
    }
    a {
      display: inline-block;
      padding: 14px 36px;
      color: #DFC784;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid rgba(223, 199, 132, 0.4);
      border-radius: 4px;
      transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }
    a:hover {
      color: #0a0a0a;
      background: #DFC784;
      border-color: #DFC784;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Возможно, ссылка устарела или была введена с ошибкой. Вернитесь на главную страницу.</p>
    <a href="/">На главную</a>
  </div>
</body>
</html>
