<div class="carousel">
  <button class="carousel__arrow carousel__arrow--left" (click)="prevSlide()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div
    class="carousel__viewport"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
    (touchcancel)="onTouchCancel()"
  >
    @for (item of sliderItems(); track item; let i = $index) {
      <div
        class="carousel__slide"
        [style]="getSliderStyle(i)"
        (click)="openGallery(i)"
      >
        <img [src]="item" [alt]="'photo ' + (i + 1)" />
      </div>
    }
  </div>
  <button class="carousel__arrow carousel__arrow--right" (click)="nextSlide()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
<div class="carousel__dots">
  @for (item of sliderItems(); track item; let i = $index) {
    <button
      class="carousel__dot"
      [class.carousel__dot--active]="i === currentSlideIndex"
      (click)="goToSlide(i)"
    ></button>
  }
</div>

<app-gallery
  [sliderItems]="sliderItems()"
  [(galleryOpen)]="galleryOpen"
  [(galleryIndex)]="galleryIndex"
></app-gallery>
