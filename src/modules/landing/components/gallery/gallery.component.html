@if (isMobile()) {
  <app-drawer [isOpen]="galleryOpen()" (closed)="onDrawerClosed()">
    <div
      class="gallery__content"
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)"
    >
      <img [src]="sliderItems()[galleryIndex()]['520']" [srcset]="sliderSrcset(sliderItems()[galleryIndex()])" sizes="95vw" [alt]="'Фото выступления ' + (galleryIndex() + 1)" class="gallery__image" />
      <div class="gallery__counter">{{ galleryIndex() + 1 }} / {{ totalSlides }}</div>
    </div>
  </app-drawer>
} @else {
  @if (rendered()) {
    <div class="gallery-backdrop" [class.gallery-backdrop--closing]="closing()" (click)="closeGallery()" (touchmove)="$event.preventDefault()"></div>
    <div class="gallery" [class.gallery--closing]="closing()">
      <button class="gallery__close" (click)="closeGallery(); $event.stopPropagation()">✕</button>
      <button class="gallery__arrow gallery__arrow--left" (click)="galleryPrev(); $event.stopPropagation()">
        <svg width="28" height="24" viewBox="0 0 28 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 12H3M3 12L10 5M3 12L10 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div
        class="gallery__content"
        (touchstart)="onTouchStart($event)"
        (touchend)="onTouchEnd($event)"
      >
        <img [src]="sliderItems()[galleryIndex()]['520']" [srcset]="sliderSrcset(sliderItems()[galleryIndex()])" sizes="95vw" [alt]="'Фото выступления ' + (galleryIndex() + 1)" class="gallery__image" />
        <div class="gallery__counter">{{ galleryIndex() + 1 }} / {{ totalSlides }}</div>
      </div>
      <button class="gallery__arrow gallery__arrow--right" (click)="galleryNext(); $event.stopPropagation()">
        <svg width="28" height="24" viewBox="0 0 28 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform: scaleX(-1)">
          <path d="M24 12H3M3 12L10 5M3 12L10 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  }
}
