<section class="main" id="hero">
  <div class="main__logo-bg" #logoBg>
    <img src="/assets/images/logo.png" alt="logo">
  </div>
  <div class="main__bg" #heroBg></div>
  <div class="main__character" #character></div>
  <div class="container">
    <div class="main__content">
      <div class="main__content__logo" #logo>
        <img src="/assets/images/logo.png" alt="logo">
      </div>
      <p class="main__content__subtitle" #subtitle>{{ subtitleText }}</p>
      <button (click)="scrollTo($event, 'contacts-form', 'center')" style="margin-bottom: 24px;" class="main__content__button" #button>
        <span>обсудить мероприятие</span>
      </button>
      <app-socials #socialsComponent class="hero-socials" />
    </div>
  </div>
</section>
