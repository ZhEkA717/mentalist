<section class="main" id="hero">
  <div class="main__logo-bg" #logoBg>
    <img ngSrc="/assets/images/logo-768.png" alt="Александр Шишук — менталист" width="300" height="133">
  </div>
  <picture class="main__bg" #heroBg>
    <source media="(max-width: 360px)" srcset="/assets/images/background-hero-360.webp">
    <source media="(max-width: 520px)" srcset="/assets/images/background-hero-520.webp">
    <source media="(max-width: 768px)" srcset="/assets/images/background-hero-768.webp">
    <img src="/assets/images/background-hero.webp" alt="Задний фон сцена" aria-hidden="true" height="1201"
         width="1920">
  </picture>
  <picture class="main__character">
    <source media="(max-width: 360px)" srcset="/assets/images/hero-360.webp">
    <source media="(max-width: 768px)" srcset="/assets/images/hero-768.webp">
    <img src="/assets/images/hero.webp" alt="Александр Шишук" width="671" height="1006">
  </picture>
  <div class="container">
    <div class="main__content">
      <div class="main__content__logo">
        <img src="/assets/images/logo.webp" alt="Александр Шишук — менталист" height="289" width="652">
      </div>
      <h1 class="visually-hidden">Александр Шишук — менталист, психологический иллюзионист</h1>
      <p class="main__content__subtitle">{{ subtitleText }}</p>
      <button (click)="scrollTo($event, 'contacts-form', 'center')" style="margin-bottom: 24px;"
              class="main__content__button" #button>
        <span>обсудить мероприятие</span>
      </button>
      <app-socials class="hero-socials"/>
    </div>
  </div>
</section>
