<div class="card" [class.card--video]="isVideo()">
  @if (reviewData(); as data) {
    <img
      class="card__quote"
      src="/assets/icons/quotes.svg"
      alt=""
      width="20"
      height="18"
      loading="lazy"
      decoding="async"
    />
    <p class="card__text">{{ data.review }}</p>
    <div class="card__author">
      <img
        class="card__photo"
        [src]="data.photo"
        [alt]="data.name"
        width="66"
        height="66"
        loading="lazy"
        decoding="async"
      />
      <div class="card__info">
        <div class="card__name">{{ data.name }}</div>
        @if (data.nameSubtitle) {
          <div class="card__subtitle">{{ data.nameSubtitle }}</div>
        }
      </div>
    </div>
  } @else if (isVideo()) {
    <button
      type="button"
      class="card__video-poster"
      (click)="onVideoClick()"
      aria-label="Включить видеоотзыв"
    >
      <img
        class="card__video-poster__image"
        [src]="posterUrl()"
        alt="Видеоотзыв"
        width="315"
        height="399"
        loading="lazy"
        decoding="async"
      />
      <span class="card__video-poster__overlay" aria-hidden="true"></span>
      @if (loading()) {
        <span class="card__video-poster__spinner" aria-hidden="true">
          <span class="card__video-poster__spinner__ring"></span>
        </span>
      } @else {
        <span class="card__video-poster__play" aria-hidden="true">
          <svg
            width="64"
            height="64"
            viewBox="0 0 48 48"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            focusable="false"
          >
            <circle cx="24" cy="24" r="23" stroke="#E6CC89" stroke-width="2" opacity="0.9"/>
            <path d="M19 15L35 24L19 33V15Z" fill="#E6CC89" opacity="0.95"/>
          </svg>
        </span>
      }
    </button>
  }
</div>
