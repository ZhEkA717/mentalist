<section class="reviews" id="reviews">
  <div class="container">
    <h2 class="reviews__title reveal-on-scroll">Компании и отзывы</h2>
    <div class="reviews__carousel reveal-on-scroll">
      <app-carousel
        [items]="items()"
        [activeWidth]="315"
        [activeHeight]="399"
        [sideSlideWidth]="315"
        [sideSlideHeight]="399"
        [slideGap]="20"
        [slideBorderPadding]="2"
        [galleryEnabled]="false"
      >
        <ng-template #slideTemplate let-item>
          <app-review-card
            [data]="item"
            [loading]="isVideoLoading(item)"
            (videoOpen)="onVideoOpen($event)"
          />
        </ng-template>
      </app-carousel>
    </div>
  </div>
</section>

@if (isMobile()) {
  <app-drawer
    [isOpen]="videoOpen()"
    (closingStart)="onDrawerClosingStart()"
    (closed)="onDrawerClosed()"
  >
    @if (videoLoading() || videoOpen()) {
      <iframe
        class="video-iframe"
        [src]="videoUrl"
        allow="autoplay; fullscreen; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        (load)="onVideoLoaded()"
      ></iframe>
    }
  </app-drawer>
} @else {
  @if (videoRendered() || videoLoading()) {
    <div
      class="video-backdrop"
      [class.video-backdrop--closing]="videoClosing()"
      [class.video-backdrop--loading]="videoLoading()"
      (click)="closeVideo()"
      (touchmove)="$event.preventDefault()"
    ></div>
    <div
      class="video-overlay"
      [class.video-overlay--closing]="videoClosing()"
      [class.video-overlay--loading]="videoLoading()"
    >
      <button
        class="video-overlay__close"
        (click)="closeVideo()"
        aria-label="Закрыть видео"
      >
        ✕
      </button>
      <iframe
        [src]="videoUrl"
        allow="autoplay; fullscreen; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        (load)="onVideoLoaded()"
      ></iframe>
    </div>
  }
}
