<div class="landing">
  <div class="safe-area"></div>
  <app-header [items]="items" (sectionClick)="onSectionClick($event.id, $event.block, $event.offset)" />
  <app-hero (sectionClick)="onSectionClick($event.id, $event.block, $event.offset)" />
  <app-promo-show />
  <section class="ribbon" id="ribbon" appMarquee marqueeMode="always">
    <div class="ribbon__content__items">
      @for (item of ribbonItems; track item.id) {
        <div class="ribbon__content__item">
          <img [src]="item.icon" [alt]="item.id" loading="lazy" decoding="async">
          <p>{{ item.description }}</p>
        </div>
      }
    </div>
  </section>
  <app-about />
  <app-lectures />
  <app-media />
  <section class="ribbon2" id="ribbon2" appMarquee>
    <div class="ribbon2__track">
      <span>ШОУ ДЛЯ МЕРОПРИЯТИЙ · МОСКВА ·<br> САНКТ-ПЕТЕРБУРГ · МИНСК · ВЕСЬ МИР</span>
    </div>
  </section>
  <app-contacts />
</div>
