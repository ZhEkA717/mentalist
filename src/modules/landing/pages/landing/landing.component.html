<div class="landing">
  <app-header [items]="items" />
  <app-hero />
  <app-promo-show />
  <section class="ribbon" id="ribbon" appMarquee marqueeMode="always">
    <div class="ribbon__content__items">
      @for (item of ribbonItems; track item.id) {
        <div class="ribbon__content__item">
          <img [src]="item.icon" [alt]="item.id">
          <p>{{ item.description }}</p>
        </div>
      }
    </div>
  </section>
  <app-about />
  <app-lectures />
  <app-media />
  <section class="ribbon2" id="ribbon2" appMarquee>
    <div class="ribbon2__track">
      <span>ШОУ ДЛЯ МЕРОПРИЯТИЙ · МОСКВА · САНКТ-ПЕТЕРБУРГ · МИНСК · ВЕСЬ МИР</span>
    </div>
  </section>
  <app-contacts />
</div>
